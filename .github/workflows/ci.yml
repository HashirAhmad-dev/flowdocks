name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    name: Tests and package
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            python3-pyqt6 x11-utils xdotool libglib2.0-bin \
            libxcb-cursor0 libxkbcommon-x11-0 xvfb xauth lintian

      - name: Unit and offscreen UI tests
        run: python3 -m unittest discover -s tests -v

      - name: Isolated X11, panel and application tests
        env:
          FLOWDOCKS_TEST_GIO: "1"
          FLOWDOCKS_TEST_X11: "1"
        run: python3 -m unittest discover -s tests -v

      - name: Build the Debian package
        run: ./scripts/build-deb.sh

      - name: Lint the package
        run: lintian dist/flowdocks_*.deb

      - uses: actions/upload-artifact@v4
        with:
          name: flowdocks-deb
          path: dist/flowdocks_*.deb
