[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "flowdocks"
version = "0.4.0"
description = "An animated PyQt6 application dock for Linux desktops"
requires-python = ">=3.10"
license = "MIT"
license-files = ["LICENSE"]
readme = "README.md"
authors = [{ name = "Hashir Ahmad", email = "hashirahmad8055@gmail.com" }]
keywords = ["dock", "launcher", "desktop", "x11", "pyqt6", "linux"]
classifiers = [
    "Environment :: X11 Applications :: Qt",
    "Intended Audience :: End Users/Desktop",
    "License :: OSI Approved :: MIT License",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3",
    "Topic :: Desktop Environment",
]
dependencies = ["PyQt6>=6.4,<7"]

[project.scripts]
flowdocks = "flowdocks.app:main"

[tool.setuptools.packages.find]
include = ["flowdocks*"]

[project.urls]
Homepage = "https://github.com/HashirAhmad-dev/flowdocks"
Issues = "https://github.com/HashirAhmad-dev/flowdocks/issues"
